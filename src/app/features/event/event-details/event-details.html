<div class="container mt-5">

  <div class="row justify-content-center">

    <div class="col-md-10 col-lg-8">

      <div class="card shadow">

        <!-- Image -->
        <img
          src="{{evt()?.imageUrl}}"
          class="card-img-top"
          style="height: 350px; object-fit: cover;"
        
        >

        <div class="card-body">

          <!-- Titre -->
          <h2 class="card-title mb-3">
           {{evt()?.titre}}
          </h2>

          <!-- Catégories -->
         

          <hr>

          <!-- Description -->
          <!-- <h5> {{evt()?.description}}</h5> -->
          <p class="text-muted">
          </p>

          <!-- Informations -->
          <div class="row mt-4">

            <div class="col-md-6 mb-3">
              <strong>📅 Date : {{evt()?.date}}</strong>
              <span class="ms-2">
              </span>
            </div>

            <div class="col-md-6 mb-3">
              <strong>📍 Lieu :</strong>
              <<span class="ms-2"> 
                 {{evt()?.lieu}} 
              </span>
            </div>

            <div class="col-md-6 mb-3">
              <strong>💰 Prix : {{evt()?.prix}}</strong>
              <span class="ms-2">
              </span>
            </div>

            <div class="col-md-6 mb-3">
              <strong>👥 Places disponibles : {{evt()?.nbPlaces}}</strong>
              <span class="ms-2">
              </span>
            </div>

            <div class="col-md-6 mb-3">
              <strong>❤️ Likes :   {{evt()?.nbLikes}}</strong>
              <span class="ms-2">
              </span>
            </div>

          </div>

          <!-- Actions -->
          <div class="d-flex gap-2 mt-4">

            <button class="btn btn-primary">
              Participer
            </button>

            <button class="btn btn-outline-danger">
              ❤️ J'aime
            </button>

            <button class="btn btn-outline-secondary">
              Retour
            </button>

          </div>

        </div>
      </div>

    </div>

  </div>

</div>
```
